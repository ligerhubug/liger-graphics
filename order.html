<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Design | LIGER Graphics</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/order.css">

<script defer src="js/order.js"></script>

</head>

<body>

<section class="order-page">

<h1>Place Your Design Order</h1>

<p>
Fill in the form below and click Submit.
We shall receive your order instantly.
</p>

<form id="orderForm">

<input
type="text"
id="name"
placeholder="Your Full Name"
required>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

<input
type="email"
id="email"
placeholder="Email Address">

<select id="service" required>

<option value="">Choose Service</option>

<option>Logo Design</option>

<option>Poster Design</option>

<option>Flyer Design</option>

<option>Business Card</option>

<option>Certificate Design</option>

<option>ID Card Design</option>

<option>Social Media Design</option>

<option>Photo Editing</option>

<option>Banner Design</option>

<option>Brochure Design</option>

</select>

<textarea
id="details"
rows="6"
placeholder="Describe your project..."
required></textarea>

<label>
Preferred Delivery Date
</label>

<input
type="date"
id="date">

<label>
Attach Files
</label>

<input
type="file"
multiple>

<button type="submit">

Submit Order

</button>

</form>

</section>

</body>
</html>
